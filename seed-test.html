    <style>
        :root {
            --bg: #0f0f10;
            --card: #1a1a1c;
            --red: #C21807;
            --text: #f5f5f5;
            --muted: #9a9a9a;
            --ok: #2ecc71;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, Segoe UI, sans-serif;
            background: radial-gradient(ellipse at top, #2a1210 0%, var(--bg) 55%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(520px, 100%);
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 28px 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

            width: 72px;
            height: auto;

            margin: 0 auto 14px;

        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.35rem;
            text-align: center;
        }
        p {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
            text-align: center;
        }
        .auth {
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 16px;
            color: var(--muted);
        }
        .auth.ok { color: var(--ok); }
        .auth.bad { color: #ff6b6b; }
        button {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--red);
            color: #fff;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); }
        button:disabled {

            margin-top: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.18);
            font-weight: 600;
        }

            margin-top: 16px;
            min-height: 1.4em;
            font-size: 0.9rem;
            text-align: center;
            white-space: pre-wrap;
            color: var(--muted);
        }
        #status.ok { color: var(--ok); }
        #status.err { color: #ff6b6b; }
        .links {

            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {

    function setStatus(msg, type) {
        statusEl.textContent = msg || '';
        statusEl.className = type || '';
    }

    function setBusy(busy) {
        seedBtn.disabled = busy || !currentUser;
        clearBtn.disabled = busy || !currentUser;
    }

    auth.onAuthStateChanged(function (user) {
        currentUser = user;
        if (user) {
            authEl.textContent = 'Logged in as ' + (user.email || user.uid);
            authEl.className = 'auth ok';
            seedBtn.disabled = false;
            clearBtn.disabled = false;
        } else {
            authEl.textContent = 'Not logged in — open Admin login first, then come back.';
            authEl.className = 'auth bad';
            seedBtn.disabled = true;
            clearBtn.disabled = true;
        }
    });

    async function seedData() {
        if (!currentUser) {
            setStatus('Please login first.', 'err');
            return;
        }
        if (!confirm('Add ' + CATALOG.length + ' categories and many menu items for testing?')) return;

        setBusy(true);
        setStatus('Seeding… please wait');

        try {
            var catCount = 0;
            var itemCount = 0;
            var email = currentUser.email || '';

            for (var i = 0; i < CATALOG.length; i++) {
                var cat = CATALOG[i];
                setStatus('Category ' + (i + 1) + '/' + CATALOG.length + ': ' + cat.name_en);

                await db.collection('categories').doc(cat.id).set({
                    name_ku: cat.name_ku,
                    name_ar: cat.name_ar,
                    name_en: cat.name_en,
                    order: cat.order,
                    image: cat.image || '',
                    seedTag: SEED_TAG,
                    createdBy: email
                }, { merge: true });
                catCount++;

                for (var j = 0; j < cat.items.length; j++) {
                    var it = cat.items[j];
                    await db.collection('menuItems').add({
                        name_ku: it[0],
                        name_ar: it[1],
                        name_en: it[2],
                        description_ku: it[2] + ' — تاقیکردنەوە',
                        description_ar: it[2] + ' — للاختبار',
                        description_en: it[2] + ' — test item',
                        price: it[3],
                        image: it[4],
                        category: cat.id,
                        available: true,
                        seedTag: SEED_TAG,
                        createdBy: email,
                        order: j + 1
                    });
                    itemCount++;
                }
            }

            setStatus('Done! Added/updated ' + catCount + ' categories and ' + itemCount + ' items.\nOpen the menu to test sticky categories.', 'ok');
        } catch (err) {
            console.error(err);
            setStatus('Error: ' + (err && err.message ? err.message : err), 'err');
        } finally {
            setBusy(false);
        }
    }

    async function clearSeedData() {
        if (!currentUser) {
            setStatus('Please login first.', 'err');
            return;
        }
        if (!confirm('Delete ONLY seeded test categories and items?')) return;

        setBusy(true);
        setStatus('Clearing seeded data…');

        try {
            var deletedItems = 0;
            var deletedCats = 0;

            var itemSnap = await db.collection('menuItems').where('seedTag', '==', SEED_TAG).get();
            var batch = db.batch();
            var ops = 0;
            for (var i = 0; i < itemSnap.docs.length; i++) {
                batch.delete(itemSnap.docs[i].ref);
                ops++;
                deletedItems++;
                if (ops >= 400) {
                    await batch.commit();
                    batch = db.batch();
                    ops = 0;
                }
            }
            if (ops) await batch.commit();

            var catSnap = await db.collection('categories').where('seedTag', '==', SEED_TAG).get();
            batch = db.batch();
            ops = 0;
            for (var c = 0; c < catSnap.docs.length; c++) {
                batch.delete(catSnap.docs[c].ref);
                ops++;
                deletedCats++;
                if (ops >= 400) {
                    await batch.commit();
                    batch = db.batch();
                    ops = 0;
                }
            }
            if (ops) await batch.commit();

            // Also remove known seed category docs if query index missing
            for (var k = 0; k < CATALOG.length; k++) {
                try {
                    var ref = db.collection('categories').doc(CATALOG[k].id);
                    var doc = await ref.get();
                    if (doc.exists && doc.data().seedTag === SEED_TAG) {
                        await ref.delete();
                        deletedCats++;
                    }
                } catch (e) {}
            }

            setStatus('Cleared ' + deletedCats + ' categories and ' + deletedItems + ' items.', 'ok');
        } catch (err) {
            console.error(err);
            setStatus('Error: ' + (err && err.message ? err.message : err) +
                '\nIf Firestore asks for an index, just use Clear again after seed, or delete from Admin.', 'err');
        } finally {
            setBusy(false);
        }
    }

    seedBtn.addEventListener('click', seedData);
    clearBtn.addEventListener('click', clearSeedData);
